spring.application.name=bedrock
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

spring.ai.model.chat=bedrock-converse
spring.ai.bedrock.aws.region=eu-west-2
spring.ai.bedrock.aws.access-key=${AWS_ACCESS_KEY_ID}
spring.ai.bedrock.aws.secret-key=${AWS_SECRET_ACCESS_KEY}
spring.ai.bedrock.converse.chat.model=arn:aws:bedrock:eu-west-2:385821429092:inference-profile/eu.anthropic.claude-sonnet-5

